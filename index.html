<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서비스 소개</title>
  <style>
    body { margin: 0; font-family: sans-serif; text-align: center; }

    .btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; }
    .features { display: flex; justify-content: center; gap: 20px; padding: 40px 20px; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>더 스마트한 업무의 시작</h1>

    <a href="#signup" class="btn">무료로 시작하기</a>
  </section>

  <section class="features">
    <div><h3>빠른 속도</h3><p>설치 없이 바로 실행됩니다.</p></div>
    <div><h3>간편한 공유</h3><p>링크 하나로 팀원과 협업하세요.</p></div>
  </section>
</body>
</html>
